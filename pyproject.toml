[project]
name = "hold"
version = "0.1.0"
description = "Hold: the agent works overnight; you only approve what spends money."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hold" }]
dependencies = [
  "strands-agents==1.55.1",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "bedrock-agentcore==1.22.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["web*", "agent*", "fixtures*", "deploy*"]
